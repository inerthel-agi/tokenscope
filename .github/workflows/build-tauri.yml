name: build-tauri

# Builds the Rust/Tauri app (tauri/target/release/tokenscope.exe) on Windows.
# Runs on every v* tag (and on demand), runs the Rust tests, and attaches
# TokenScope-Tauri.exe to the matching GitHub release.
# Actions are pinned to commit SHAs (tag kept as a comment); only the release
# job can write to the repository.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tauri

      - name: Test
        working-directory: tauri
        run: cargo test --release

      - name: Build
        working-directory: tauri
        run: cargo build --release

      - name: Rename
        run: Copy-Item tauri/target/release/tokenscope.exe TokenScope-Tauri.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TokenScope-Tauri-windows
          path: TokenScope-Tauri.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TokenScope-Tauri-windows

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: TokenScope-Tauri.exe
