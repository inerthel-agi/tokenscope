[package]
name = "tokenscope"
version = "1.5.0"
description = "Local token usage and subscription quotas for Claude Code, Codex and Antigravity"
edition = "2021"
publish = false

[[bin]]
name = "tokenscope"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2"
base64 = "0.22"
percent-encoding = "2"
ruzstd = "0.8"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
